[project]
name = "pydantic-ai-app-factory"
version = "0.1.0"
description = "Compose a Pydantic AI agent and its features into a FastAPI application"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "aiXbrain GmbH", email = "dev@aixbrain.de" }]
keywords = ["pydantic-ai", "agent", "fastapi", "composition"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic-ai-slim>=2.16,<3",
]

[project.optional-dependencies]
# What the runnable examples need on top of the package itself.
examples = ["fastapi[standard]>=0.115", "logfire[fastapi]>=5"]

[project.urls]
Homepage = "https://github.com/aixbrain/pydantic-ai-app-factory"
Repository = "https://github.com/aixbrain/pydantic-ai-app-factory"
Issues = "https://github.com/aixbrain/pydantic-ai-app-factory/issues"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115",
    "logfire[fastapi]>=5",
    "httpx>=0.27",
    "pytest>=9",
    "pytest-cov>=7",
    "pyright>=1.1.411",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_app_factory", "pydantic_ai_app_factory_examples"]

# An allow-list, so a local build ships only tracked sources, never untracked files in the checkout.
[tool.hatch.build.targets.sdist]
include = ["pydantic_ai_app_factory", "pydantic_ai_app_factory_examples", "tests", "docs/*.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
include = ["pydantic_ai_app_factory", "pydantic_ai_app_factory_examples", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false
# Redundant with the 100% coverage gate (a truly unused function stays uncovered) and a false
# positive on framework-registered route handlers.
reportUnusedFunction = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pydantic_ai_app_factory"]

[tool.coverage.report]
fail_under = 100
show_missing = true
